<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .box { border: 1px solid #ccc; padding: 25px; width: 320px; margin: auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 95%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #m { color: green; font-weight: bold; margin-top: 15px; }
        .links { margin-top: 20px; display: block; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h3>Feedback Form</h3>
    <input id="n" placeholder="Name"><br>
    <input id="r" placeholder="Register Number"><br>
    <input id="f" placeholder="Feedback"><br>
    <button onclick="s()">Submit</button>
    <p id="m"></p>
    <a class="links" href="admin.html">Go to Admin Panel</a>
</div>

<script>
function s(){
    let name = document.getElementById("n").value;
    let reg = document.getElementById("r").value;
    let fb = document.getElementById("f").value;
    
    if(name == "" || reg == "" || fb == "") {
        return alert("Ellam boxes-aiyum type pannu!");
    }
    
    let newFeedback = {
        name: name,
        reg: reg, 
        fb: fb
    };

    const SUPABASE_URL = "https://goxtanujrmtlpbatomiz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_kH_Sqsq3Y13zAK6Q5LR5Zw_i7QxlYa_"

    fetch(SUPABASE_URL + "/rest/v1/feedbacks", {
    method: "POST",
    headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
    },
    body: JSON.stringify(newFeedback)
})
.then(response => {
    if (!response.ok) {
        throw new Error("Submit failed");
    }

    document.getElementById("m").innerText =
        "Submitted Successfully!";

    document.getElementById("n").value = "";
    document.getElementById("r").value = "";
    document.getElementById("f").value = "";
})
.catch(error => {
    console.log(error);
    document.getElementById("m").innerText =
        "Submission failed!";
});

   

   
}
</script>

</body>
</html>
