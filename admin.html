<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial; padding: 30px; background-color: #f4f4f9; text-align: center; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Dashboard - Student Feedbacks</h2>
    <a class="back-btn" href="index.html">← Back to Feedback Form</a>

    <table>
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Register Number</th>
                <th>Feedback</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data will load here dynamically -->
        </tbody>
    </table>
</div>

<script>

const SUPABASE_URL = "https://goxtanujrmtlpbatomiz.supabase.co";

const SUPABASE_KEY = "sb_publishable_kH_Sqsq3Y13zAK6Q5LR5Zw_i7QxlYa_";


function loadData() {

    let tableBody = document.getElementById("tableBody");

    fetch(
        SUPABASE_URL + "/rest/v1/feedbacks?select=name,reg,fb&order=created_at.desc",
        {
            method: "GET",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    )

    .then(response => {

        if (!response.ok) {
            throw new Error("Unable to load feedbacks");
        }

        return response.json();

    })

    .then(data => {

        tableBody.innerHTML = "";

        if (data.length === 0) {

            tableBody.innerHTML =
                "<tr><td colspan='3' style='text-align:center;'>No feedbacks available.</td></tr>";

            return;
        }

        data.forEach(item => {

            let row = `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.reg}</td>
                    <td>${item.fb}</td>
                </tr>
            `;

            tableBody.innerHTML += row;

        });

    })

    .catch(error => {

        console.log(error);

        tableBody.innerHTML =
            "<tr><td colspan='3' style='text-align:center;'>Unable to load feedbacks.</td></tr>";

    });
}

window.onload = loadData;

</script>

</body>
</html>
